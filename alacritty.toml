[font]
normal = { family = "Commit Mono", style = "Regular" }
bold   = { family = "Commit Mono", style = "Bold" }
italic = { family = "Commit Mono", style = "Italic" }
size = 13.0

[font.offset]
y = 2

[colors.primary]
background = "#ffffff"
foreground = "#4c4f69"

[colors.cursor]
text   = "#ffffff"
cursor = "#4c4f69"

[colors.normal]
black   = "#9ca0b0"
red     = "#d20f39"
green   = "#40a02b"
yellow  = "#df8e1d"
blue    = "#1e66f5"
magenta = "#8839ef"
cyan    = "#179299"
white   = "#4c4f69"

[colors.bright]
black   = "#8c8fa1"
red     = "#d20f39"
green   = "#40a02b"
yellow  = "#df8e1d"
blue    = "#1e66f5"
magenta = "#8839ef"
cyan    = "#179299"
white   = "#4c4f69"

[window]
padding = { x = 12, y = 12 }
decorations = "full"
opacity = 1.0

[cursor]
style = { shape = "Block", blinking = "On" }
